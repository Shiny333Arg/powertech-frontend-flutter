name: powertech_tienda
description: "PowerTech - app cliente de la tienda online."
publish_to: 'none'
version: 0.1.0+1

environment:
  # go_router 18.x exige Dart ^3.12.0 / Flutter >=3.44.0.
  # Si tu Flutter es mas viejo: 'flutter upgrade', o ver la nota del paso 0.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^3.4.3

  # HTTP (interceptores: token, logging, mapeo de errores)
  dio: ^5.11.1

  # Token Sanctum en almacenamiento cifrado del SO
  flutter_secure_storage: ^11.2.0

  # Navegacion declarativa con redirect por estado de sesion
  go_router: ^18.1.3

  # Formato de precios en es-AR ($ 1.234,56) y fechas
  intl: ^0.20.3

  # Abrir el init_point de Mercado Pago en el navegador del sistema.
  # Las credenciales de MP NO viven en Flutter: solo se abre la URL.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Logo_Primary_Icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Logo_Primary_Icon.png"


flutter_native_splash:
  color: "#0d6efd"
  image: assets/images/Logo_Splash.png

  android: true
  ios: false
  web: false

  android_12:
    color: "#0d6efd"
    image: assets/images/Logo_Splash.png